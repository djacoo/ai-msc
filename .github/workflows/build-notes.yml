name: build-notes

on:
  push:
    branches: [main]
    paths:
      - '**/notes/**/*.tex'
      - 'Makefile'
      - '.github/workflows/build-notes.yml'
  pull_request:
    paths:
      - '**/notes/**/*.tex'
      - 'Makefile'
      - '.github/workflows/build-notes.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: List notes
        run: make list

      - name: Build all notes
        run: make notes

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-pdfs
          path: '**/notes/**/*.pdf'
          if-no-files-found: warn
          retention-days: 14
